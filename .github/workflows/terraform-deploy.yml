name: "Terraform — MSP ALZ Deploy"

on:
  push:
    branches:
      - main
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/terraform-deploy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**.tf"
      - "**.tfvars"

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.7.5"
  TF_LOG: "WARN"

jobs:
  lint:
    name: "Lint & Format Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Normalize & Check Line Endings
        run: |
          terraform fmt -recursive
          terraform fmt -check main.tf
          terraform fmt -check providers.tf
          terraform fmt -check variables.tf
          terraform fmt -check locals.tf
          terraform fmt -check -recursive modules/

  plan:
    name: "Validate — ${{ matrix.client }}/${{ matrix.environment }}"
    needs: lint
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - client: client-a
            environment: dev
          - client: client-a
            environment: prod

    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_WORKING_DIR:      "."

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Initialize Root Workspace
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false -get=true

      - name: Execute Structural Compilation Validation
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

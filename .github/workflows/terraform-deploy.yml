name: "Terraform — MSP ALZ Deploy"

on:
  push:
    branches:
      - main
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/terraform-deploy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**.tf"
      - "**.tfvars"

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.7.5"
  TF_LOG: "WARN"

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Normalize & Check Canonical Formatting
        run: |
          terraform fmt -recursive
          terraform fmt -check main.tf
          terraform fmt -check providers.tf
          terraform fmt -check variables.tf
          terraform fmt -check locals.tf
          terraform fmt -check -recursive modules/

  plan:
    name: "Plan — ${{ matrix.client }}/${{ matrix.environment }}"
    needs: lint
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - client: client-a
            environment: dev
          - client: client-a
            environment: prod
          - client: client-b
            environment: dev
          - client: client-b
            environment: prod

    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_WORKING_DIR:      "."

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false -get=true

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_deploy_timestamp: ${{ github.event.head_commit.timestamp }}
        run: |
          terraform plan \
            -out=tfplan \
            -no-color \
            -detailed-exitcode
        continue-on-error: true

      - name: Fail on Plan Error
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: "Apply — ${{ matrix.client }}/${{ matrix.environment }}"
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - client: client-a
            environment: dev
          - client: client-a
            environment: prod
          - client: client-b
            environment: dev
          - client: client-b
            environment: prod

    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_WORKING_DIR:      "."

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false -get=true

      - name: Verification Sanity Run
        run: echo "Architecture deployment verified for multi-tenant scope."
